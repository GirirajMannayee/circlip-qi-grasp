# Controller configuration (Table 21). Every value is a DESIGN / STARTING VALUE, not a measurement: the manuscript's force
# window (Sec. 3.4) and the quantities below must be re-identified on the physical gripper and circlip before any robot run.
# K_P / K_I are derived from (k_c, omega_n, zeta) exactly as in Sec. 3.4: K_P = 2*zeta*omega_n/k_c, K_I = omega_n^2/k_c.
force:
  setpoint_N: 14.0            # F_d (design value)
  band_N: [10.0, 20.0]        # F_min, F_max (design values); F_max is enforced by the independent safety supervisor
  contact_stiffness_k_c: 2.0  # N/mm, starting value for silicone pads (re-identify, assumption A4)
  omega_n: 10.0               # rad/s (~1.6 Hz); far below the 50 Hz Nyquist limit of the 100 Hz F/T sensor
  zeta: 1.0                   # tuning parameter of the force loop (overshoot ~14 % at 1.0, Sec. 3.4)
  K_P: 10.0                   # mm/s per N  = 2*1.0*10/2.0
  K_I: 50.0                   # mm/s per (N*s) = 10^2/2.0
  integrator_clamp: 0.4      # N*s; caps the integral term at 20 mm/s finger velocity (K_I * I_max)
  sensor_rate_hz: 100
optimizer:
  mode: soft                  # argmax | hard | soft
  K: 2                        # soft oracle optimum on the seed-42 set (hard: K_opt = 3)
  gamma: 6.0
  weights: {position: 0.30, orientation: 0.25, expansion: 0.20, force: 0.15, slip: 0.10}
  watchdog_ms: 10             # T_wd: one 100 Hz F/T sample period; Rust core measured ~1 us on a dev machine, so fallback should never fire (re-check on target hardware, H5)
  fallback: exhaustive_argmax
task:
  carry_mm: 100
  advance_mm: 30
  hold_s: 3
  initial_orientation_deg: [0, 30, 60]
  circlip: {type: "DIN 471-type external", thickness_mm: 1.2, shaft_mm: 20}   # nominal - replace with the real parts
  sleeve: {outer_diameter_mm: 20, groove_diameter_mm: 19, groove_width_mm: 1.3}
  max_expansion_cycles_per_circlip: 10     # cap against permanent set; logged per trial (expansion_cycle_no)
